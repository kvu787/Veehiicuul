; Rendering and pipeline settings are loaded at startup; restart after editing.
[Rendering]
VSync = false

[Pipeline]
; MinimizeInputLatency, Standard, or Custom. VSync is independent of this mode.
Mode = Standard

[Pipeline.Custom]
; Ignored completely unless Mode = Custom. All six keys are required in Custom.
MaxGpuFramesInFlight = 2
MaxPresentLatency = 2
WaitForPresentation = true
BackBufferCount = 3
AllowTearing = false
WaitStrategy = Event

; SimplePaint settings loaded at startup. See Documentation/Usage.md for limits.
; BaseColor values are sRGB triples in [0.0009765625, 0.9990234375].
; Each material has independent paint controls.

[SimplePaintShader_Axles]
BaseColor = 0.678429127, 0.678431321, 0.678431321
Brightness = 0.5
Shift = 0.0
RotationDegrees = 0.0
DarkPoint = 0.0
LightPoint = 0.8

[SimplePaintShader_Body]
